name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build All Cross-Platform Binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          CLEAN_VER="${VERSION#v}"

          echo "Building version $VERSION..."

          # 1. Linux x86_64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o kickoff ./cmd/kickoff
          tar -czf "dist/kickoff_${CLEAN_VER}_linux_amd64.tar.gz" kickoff LICENSE README.md
          rm kickoff

          # 2. Windows x86_64 (.zip bundle with kickoff.exe, Instalar-Kickoff.bat, and kickoff.ico)
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o kickoff.exe ./cmd/kickoff
          zip -j "dist/kickoff_${CLEAN_VER}_windows_amd64.zip" kickoff.exe assets/Instalar-Kickoff.bat assets/install-mpv.bat assets/kickoff.ico LICENSE README.md
          rm kickoff.exe

          # 3. macOS Apple Silicon (ARM64)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o kickoff ./cmd/kickoff
          tar -czf "dist/kickoff_${CLEAN_VER}_macos_arm64.tar.gz" kickoff LICENSE README.md
          rm kickoff

          # 4. Checksums
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          name: "kickoff ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
