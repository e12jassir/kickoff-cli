<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="kickoff — the football scoreboard that lives in your terminal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050f0c"/>
      <stop offset="0.55" stop-color="#0a211b"/>
      <stop offset="1" stop-color="#0d3a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2bbc8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2bbc8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ff0d0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="360" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- pitch markings -->
    <g fill="none" stroke="#2bbc8a" stroke-opacity="0.16" stroke-width="2">
      <line x1="1000" y1="-10" x2="1000" y2="370"/>
      <circle cx="1000" cy="180" r="96"/>
      <circle cx="1000" cy="180" r="4" fill="#2bbc8a" fill-opacity="0.3"/>
      <rect x="1190" y="80" width="120" height="200"/>
      <rect x="1250" y="130" width="60" height="100"/>
    </g>

    <!-- badge pill -->
    <rect x="80" y="64" rx="14" ry="14" width="214" height="28" fill="#2bbc8a" fill-opacity="0.12" stroke="#2bbc8a" stroke-opacity="0.45"/>
    <circle cx="100" cy="78" r="4" fill="#2bbc8a"/>
    <text x="114" y="83" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="2.2" fill="#8fe3c3">TERMINAL FOOTBALL</text>

    <!-- title -->
    <text x="80" y="188" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace" font-size="100" font-weight="800" fill="url(#title)" textLength="420" lengthAdjust="spacingAndGlyphs">kickoff</text>
    <rect x="516" y="108" width="26" height="78" rx="3" fill="#2bbc8a">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="82" y="240" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#c3ded4">The football scoreboard that lives in your terminal.</text>
    <text x="82" y="284" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="3" fill="#5fae93">LIVE SCORES  ·  MATCH CENTER  ·  LINEUPS  ·  PLAYBACK</text>

    <!-- scoreboard card -->
    <g>
      <rect x="840" y="96" width="320" height="168" rx="18" fill="#06130f" fill-opacity="0.88" stroke="#2bbc8a" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="870" cy="128" r="5" fill="#ff5d5d">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="884" y="133" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#ff8a8a">LIVE</text>
      <text x="1128" y="133" text-anchor="end" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#8fe3c3">67'</text>
      <line x1="862" y1="150" x2="1138" y2="150" stroke="#2bbc8a" stroke-opacity="0.2"/>
      <text x="1000" y="216" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="62" font-weight="800" fill="#ffffff">2 – 1</text>
      <text x="1000" y="248" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2.4" fill="#5fae93">TIMELINE · STATS · LINEUPS</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="358.5" rx="21.5" fill="none" stroke="#2bbc8a" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
